# nginx config for the production frontend container.
# Serves the Vite-built static bundle and proxies /api/* to the API service.

server {
    listen 80;
    server_name _;

    # SPA-friendly root + index.
    root /usr/share/nginx/html;
    index index.html;

    # Security headers — defense in depth (helmet on the API covers /api
    # responses; this covers the static asset responses).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hide nginx version in Server header.
    server_tokens off;

    # Allow large uploads through the proxy. Backend enforces the real
    # MAX_FILE_SIZE; this just keeps nginx from rejecting the body first.
    client_max_body_size 600M;

    # Proxy /api/* to the backend service.
    # "api" resolves via Docker's built-in DNS to the api container.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-running downloads need generous timeouts.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # Don't buffer downloads — stream straight from the backend.
        proxy_buffering off;
    }

    # Hashed assets (Vite emits content-hashed filenames) — safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: anything else falls back to index.html so client-side
    # routing keeps working on page refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
